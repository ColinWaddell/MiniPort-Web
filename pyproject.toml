[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eb200"
version = "0.7.2"
description = "Standalone driver and probe tools for the Rohde & Schwarz EB200 receiver"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Colin Waddell" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/ColinWaddell/MiniPort-Web"

[project.scripts]
eb200-probe = "eb200.cli:main"
eb200-server = "eb200_server.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.15", "httpx>=0.27"]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests talking to the physical EB200 (opt-in with 'pytest -m integration')",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]